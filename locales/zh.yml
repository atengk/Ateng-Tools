about:
  content: >
    # 关于 Ateng-Tools

    Ateng-Tools 是一个专注于为开发者与 IT 从业者提供高频实用工具的在线工具箱，基于开源项目 [IT-Tools](https://github.com/CorentinTh/it-tools)（作者：[Corentin Thomasset](https://corentin.tech)）二次开发构建，遵循 GPL-3.0 开源许可协议。

    所有工具均采用纯浏览器端内存执行（Client-Side Only）架构，您的数据（代码、日志、SQL、密钥、Token）绝不会离开本地浏览器，100% 保护开发隐私安全。

    ## 开源与致谢

    - **本工具箱仓库**：[atengk/Ateng-Tools](https://github.com/atengk/Ateng-Tools)
    - **上游原项目**：[CorentinTh/it-tools](https://github.com/CorentinTh/it-tools)
    - **开源许可证**：GNU General Public License v3.0 (GPL-3.0)

    ## 技术栈

    Ateng-Tools 采用 Vue.js 3、TypeScript、Vite、Naive UI 与 UnoCSS 开发，并部署于 GitHub Pages。

    ## 发现了 Bug？缺少工具？

    如果您在使用中发现 Bug 或希望新增更多开发小工具，欢迎在 GitHub 仓库的 [issues](https://github.com/atengk/Ateng-Tools/issues/new/choose) 中提交请求与反馈。


