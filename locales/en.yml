about:
  content: >
    # About Ateng-Tools

    Ateng-Tools is a handy online toolbox for developers and IT professionals, built upon the open-source project [IT-Tools](https://github.com/CorentinTh/it-tools) by [Corentin Thomasset](https://corentin.tech), licensed under GNU GPL-3.0.

    All tools run 100% locally in your browser memory (Client-Side Only). Your sensitive data (code, logs, SQL, tokens, keys) is never uploaded to any remote server, guaranteeing complete privacy and zero data leaks.

    ## Open Source & Attribution

    - **Repository**: [atengk/Ateng-Tools](https://github.com/atengk/Ateng-Tools)
    - **Upstream Project**: [CorentinTh/it-tools](https://github.com/CorentinTh/it-tools)
    - **License**: GNU General Public License v3.0 (GPL-3.0)

    ## Technologies

    Ateng-Tools is built with Vue 3, TypeScript, Vite, Naive UI, and UnoCSS, deployed statically on GitHub Pages.

    ## Found a bug or missing a tool?

    If you found a bug or have an idea for a useful developer tool, please feel free to open an issue or feature request in our [GitHub Issues](https://github.com/atengk/Ateng-Tools/issues).


